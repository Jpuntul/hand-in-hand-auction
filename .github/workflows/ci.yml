name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-frontend:
    name: Frontend (Lint, Typecheck, Unit Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check src

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm vitest run

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://raxaicqhlbmyzngcubye.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "dummy-vapid-key"
          NEXT_PUBLIC_SENTRY_DSN: ""
        run: pnpm build

  test-database:
    name: Database (Migrations, Drift Gate, pgTAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Start Supabase
        run: supabase start

      - name: Drift Gate
        run: |
          DIFF_OUTPUT=$(supabase db diff --schema public)
          if echo "$DIFF_OUTPUT" | grep -q "No schema changes found"; then
            echo "No schema drift detected between migrations and shadow database."
          else
            echo "Schema drift detected:"
            echo "$DIFF_OUTPUT"
            exit 1
          fi

      - name: Run pgTAP tests
        run: supabase test db
